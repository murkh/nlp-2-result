version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nlp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nlp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nlp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DATABASE_URL is opened with psycopg (sync) — a +asyncpg scheme makes the
      # connection fail and silently falls back to in-memory SQLite (data lost on restart).
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/knowledge_base
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/knowledge_base
      BLOB_STORAGE_PATH: /app/data/blob
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
      OPENAI_API_URL: ${OPENAI_API_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      # Cached on a named volume so the HuggingFace model downloads only once
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/blob:/app/data/blob
      - ./data/db:/app/data/db
      - fastembed_cache:/app/.cache/fastembed
    networks:
      - nlp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nlp_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    networks:
      - nlp_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: nlp_langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: devsecretkey1234567890
      SALT: devsaltkey1234567890
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    networks:
      - nlp_network

networks:
  nlp_network:
    driver: bridge

volumes:
  postgres_data:
  fastembed_cache:
